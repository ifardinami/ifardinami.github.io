<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fardin — Usernames</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@500&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #e8e6df;
            color: #2c2c2c;
            font-family: "Roboto Mono", monospace;
            font-weight: 500;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 32px 20px;
        }

        main {
            width: 100%;
            max-width: 620px;
        }

        h1 {
            margin: 0 0 30px;
            font-size: 28px;
            line-height: 1.3;
            font-weight: 500;
            letter-spacing: -0.7px;
        }

        .item {
            display: flex;
            justify-content: space-between;
            gap: 24px;
            padding: 14px 0;
            border-bottom: 1px solid #cbc8bf;
            font-size: 15px;
            line-height: 1.6;
        }

        .label {
            color: #66635d;
            white-space: nowrap;
        }

        .value {
            text-align: right;
        }

        a {
            color: #222;
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
            text-underline-offset: 4px;
        }

        @media (max-width: 520px) {
            body {
                align-items: flex-start;
                padding-top: 56px;
            }

            .item {
                display: block;
            }

            .label {
                display: block;
                margin-bottom: 4px;
            }

            .value {
                text-align: left;
            }
        }
    </style>
</head>
<body>
    <main>
        <h1>My Usernames</h1>

        <div class="item">
            <span class="label">GitHub</span>
            <span class="value">
                <a href="https://github.com/ifardinami" target="_blank" rel="noopener noreferrer">ifardinami</a>
            </span>
        </div>

        <div class="item">
            <span class="label">Facebook</span>
            <span class="value">
                <a href="https://www.facebook.com/ifardinami" target="_blank" rel="noopener noreferrer">ifardinami</a>
            </span>
        </div>

        <div class="item">
            <span class="label">Instagram</span>
            <span class="value">
                <a href="https://www.instagram.com/ifardinami/" target="_blank" rel="noopener noreferrer">ifardinami</a>
            </span>
        </div>

        <div class="item">
            <span class="label">Telegram</span>
            <span class="value">
                <a href="https://t.me/ifardinami" target="_blank" rel="noopener noreferrer">ifardinami</a>
            </span>
        </div>

        <div class="item">
            <span class="label">WhatsApp</span>
            <span class="value">
                <a href="https://wa.me/ifardinami" target="_blank" rel="noopener noreferrer">ifardinami</a>
                &nbsp;/&nbsp;
                <a href="https://wa.me/me.fardin" target="_blank" rel="noopener noreferrer">me.fardin (P)</a>
            </span>
        </div>

        <div class="item">
            <span class="label">LinkedIn</span>
            <span class="value">
                <a href="https://www.linkedin.com/in/iamfardin/" target="_blank" rel="noopener noreferrer">iamfardin</a>
            </span>
        </div>
    </main>
</body>
</html>
